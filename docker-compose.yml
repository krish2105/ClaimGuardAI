services:
  postgres:
    image: postgres:15
    container_name: claimguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard
      POSTGRES_DB: claimguard
    ports:
      # Host port 5433 (not 5432) to avoid clashing with another local Postgres.
      - "5433:5432"
    volumes:
      - claimguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: claimguard_qdrant
    restart: unless-stopped
    ports:
      # Host ports 6433/6434 (not 6333/6334) to avoid clashing with another local Qdrant.
      - "6433:6333"
      - "6434:6334"
    volumes:
      - claimguard_qdrant_data:/qdrant/storage
    # No healthcheck here: the qdrant/qdrant image ships neither wget nor
    # curl, so an HTTP-based healthcheck always fails regardless of whether
    # Qdrant is actually up — a well-known gotcha with this image. Qdrant
    # starts in about a second, and nothing touches it until the seeding
    # scripts are run manually afterward, so `service_started` is enough.

  backend:
    build:
      # Repo root, not ./backend — the Dockerfile also needs to bake in the
      # policies/ corpus, which is a sibling of backend/, not nested under it.
      context: .
      dockerfile: backend/Dockerfile
    container_name: claimguard_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://claimguard:claimguard@postgres:5432/claimguard
      QDRANT_URL: http://qdrant:6333
    ports:
      # Host port 8100 (not 8000) to avoid clashing with other local projects.
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      # The policy corpus lives at the repo root (a sibling of backend/, not
      # nested under it), so it isn't part of the backend build context and
      # needs its own mount. scripts/ingest_policies.py expects it at /policies.
      - ./policies:/policies:ro

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are inlined into the browser bundle at build time,
      # so they're passed as build args here, not as container `environment:`
      # (which would have no effect on an already-built .next output).
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8100
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8100
    container_name: claimguard_frontend
    restart: unless-stopped
    ports:
      # Host port 3100 (not 3000) to avoid clashing with other local projects.
      - "3100:3000"
    depends_on:
      - backend

volumes:
  claimguard_pgdata:
  claimguard_qdrant_data:
