# Render "Blueprint" — deploys the FastAPI backend, a self-hosted Qdrant
# instance (private, internal-only — no separate Qdrant Cloud account
# needed), and a managed Postgres database, all in one step. Import this
# repo at https://dashboard.render.com/blueprints
#
# Note: the free-tier Qdrant private service has no persistent disk, so its
# data is wiped on every redeploy/restart — re-run
# `scripts/ingest_policies.py` afterward (it takes a few seconds). Upgrade
# claimguard-qdrant to a paid instance type with a disk if you want the
# index to survive restarts.
#
# See docs/DEPLOYMENT.md for the full walkthrough (including the frontend
# on Vercel).
databases:
  - name: claimguard-postgres
    plan: free
    databaseName: claimguard
    user: claimguard

services:
  - type: pserv
    name: claimguard-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:v1.12.4
    plan: free

  - type: web
    name: claimguard-backend
    runtime: docker
    # Repo root, not ./backend — the Dockerfile also bakes in the policies/
    # corpus, which is a sibling of backend/, not nested under it.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-postgres
          property: connectionString
      - key: QDRANT_URL
        value: http://claimguard-qdrant:6333
      - key: ANTHROPIC_API_KEY
        sync: false  # optional — leave blank to run in mock mode
      - key: CLAUDE_MODEL_REASONING
        value: claude-sonnet-4-5
      - key: CLAUDE_MODEL_EXTRACTION
        value: claude-haiku-4-5
      - key: CORS_ORIGINS
        sync: false  # set to your Vercel frontend URL once you have it, e.g. https://claimguard-ai.vercel.app
      - key: ADMIN_SEED_TOKEN
        generateValue: true  # Render generates a random secret; read it from the dashboard to call POST /admin/seed
