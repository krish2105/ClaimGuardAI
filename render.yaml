# Render "Blueprint" — deploys the FastAPI backend, a self-hosted Qdrant
# instance, and a managed Postgres database, all in one step. Import this
# repo at https://dashboard.render.com/blueprints
#
# Qdrant is deployed as a `web` service, not `pserv` (private service) —
# Render's free/workspace plan doesn't support private services at all
# ("service type is not available for this plan"). A `web` service does
# get a public URL, so it's locked down with an auto-generated API key
# (QDRANT__SERVICE__API_KEY) shared with the backend via QDRANT_API_KEY —
# nobody without that key can read/write the index. The backend still
# reaches it over Render's internal network (http://claimguard-qdrant:6333),
# not the public internet, so this costs nothing extra in latency.
#
# Note: the free-tier Qdrant service has no persistent disk, so its data is
# wiped on every redeploy/restart — re-run POST /admin/seed afterward (see
# docs/DEPLOYMENT.md). Upgrade claimguard-qdrant to a paid instance type
# with a disk if you want the index to survive restarts.
databases:
  - name: claimguard-postgres
    plan: free
    databaseName: claimguard
    user: claimguard

services:
  - type: web
    name: claimguard-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:v1.12.4
    plan: free
    envVars:
      - key: QDRANT__SERVICE__API_KEY
        generateValue: true

  - type: web
    name: claimguard-backend
    runtime: docker
    # Repo root, not ./backend — the Dockerfile also bakes in the policies/
    # corpus, which is a sibling of backend/, not nested under it.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-postgres
          property: connectionString
      - key: QDRANT_URL
        value: http://claimguard-qdrant:6333
      - key: QDRANT_API_KEY
        fromService:
          name: claimguard-qdrant
          type: web
          envVarKey: QDRANT__SERVICE__API_KEY
      - key: ANTHROPIC_API_KEY
        sync: false  # optional — leave blank to run in mock mode
      - key: CLAUDE_MODEL_REASONING
        value: claude-sonnet-4-5
      - key: CLAUDE_MODEL_EXTRACTION
        value: claude-haiku-4-5
      - key: CORS_ORIGINS
        sync: false  # set to your Vercel frontend URL once you have it, e.g. https://claimguard-ai.vercel.app
      - key: ADMIN_SEED_TOKEN
        generateValue: true  # Render generates a random secret; read it from the dashboard to call the /admin/seed/* endpoints
      - key: FORCE_TFIDF_EMBEDDINGS
        value: "true"  # skip sentence-transformers/torch (~300-500MB) entirely — too tight a fit for the 512MB free-tier instance
      - key: SENTRY_DSN
        sync: false  # optional — paste a free Sentry.io project DSN to enable error tracking; leave blank to disable
